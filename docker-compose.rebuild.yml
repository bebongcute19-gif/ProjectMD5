version: '3.8'

services:
  # ============================================================================
  # DATABASE (Containerized PostgreSQL with automatic DB initialization)
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-nexus_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Vui lòng cấu hình POSTGRES_PASSWORD trong file .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-databases.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - backend-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexus_admin}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================================================
  # INFRASTRUCTURE SERVICES (Redis & RabbitMQ - Internal Only, Persistent Volumes)
  # ============================================================================
  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis_data:/data
    networks:
      - backend-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-nexus_rabbit}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?Vui lòng cấu hình RABBITMQ_DEFAULT_PASS trong file .env}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "127.0.0.1:15672:15672"
    networks:
      - backend-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 10s
      retries: 5

  # ============================================================================
  # BACKEND MICROSERVICES (Zero public ports - bounded JVM Memory -Xmx384m)
  # ============================================================================
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    restart: always
    environment:
      JAVA_OPTS: "-Xms128m -Xmx384m"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/auth_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-nexus_admin}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Vui lòng cấu hình POSTGRES_PASSWORD trong file .env}
      JWT_SECRET: ${JWT_SECRET:?Vui lòng cấu hình JWT_SECRET trong file .env}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend-network

  product-service:
    build:
      context: ./product-service
      dockerfile: Dockerfile
    restart: always
    environment:
      JAVA_OPTS: "-Xms128m -Xmx384m"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/product_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-nexus_admin}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Vui lòng cấu hình POSTGRES_PASSWORD trong file .env}
      ORDER_SERVICE_URL: http://order-service:8083
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend-network

  order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile
    restart: always
    environment:
      JAVA_OPTS: "-Xms128m -Xmx384m"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/order_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-nexus_admin}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Vui lòng cấu hình POSTGRES_PASSWORD trong file .env}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER:-nexus_rabbit}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:?Vui lòng cấu hình RABBITMQ_DEFAULT_PASS trong file .env}
      PRODUCT_SERVICE_URL: http://product-service:8082
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - backend-network

  payment-service:
    build:
      context: ./payment-service
      dockerfile: Dockerfile
    restart: always
    environment:
      JAVA_OPTS: "-Xms128m -Xmx384m"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/payment_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-nexus_admin}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Vui lòng cấu hình POSTGRES_PASSWORD trong file .env}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER:-nexus_rabbit}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:?Vui lòng cấu hình RABBITMQ_DEFAULT_PASS trong file .env}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - backend-network

  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    restart: always
    environment:
      JAVA_OPTS: "-Xms128m -Xmx384m"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/notification_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-nexus_admin}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Vui lòng cấu hình POSTGRES_PASSWORD trong file .env}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER:-nexus_rabbit}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:?Vui lòng cấu hình RABBITMQ_DEFAULT_PASS trong file .env}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - backend-network

  # ============================================================================
  # PUBLIC FACING SERVICES (Bound to 127.0.0.1 for Host Nginx Reverse Proxy / SSL)
  # ============================================================================
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    restart: always
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8080}:8080"
    environment:
      JAVA_OPTS: "-Xms128m -Xmx384m"
      AUTH_SERVICE_URL: http://auth-service:8081
      PRODUCT_SERVICE_URL: http://product-service:8082
      ORDER_SERVICE_URL: http://order-service:8083
      PAYMENT_SERVICE_URL: http://payment-service:8084
      NOTIFICATION_SERVICE_URL: http://notification-service:8085
      JWT_SECRET: ${JWT_SECRET:?Vui lòng cấu hình JWT_SECRET trong file .env}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-10000}
    depends_on:
      - auth-service
      - product-service
      - order-service
      - payment-service
      - notification-service
    networks:
      - backend-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:80"
    depends_on:
      - api-gateway
    networks:
      - backend-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  rabbitmq_data:
    driver: local

networks:
  backend-network:
    driver: bridge
