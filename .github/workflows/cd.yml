
name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: cd-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy ProjectMD5 to VPS
    runs-on: ubuntu-latest

    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Configure SSH and verify VPS fingerprint
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST_FINGERPRINT: ${{ secrets.VPS_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail

          if [ -z "$VPS_HOST" ] || [ -z "$VPS_SSH_KEY" ]; then
            echo "Missing VPS_HOST or VPS_SSH_KEY" >&2
            exit 1
          fi

          if [ -z "$VPS_HOST_FINGERPRINT" ]; then
            echo "Missing VPS_HOST_FINGERPRINT" >&2
            exit 1
          fi

          install -m 700 -d ~/.ssh

          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          tmpfile=$(mktemp)
          trap 'rm -f "$tmpfile"' EXIT

          ssh-keyscan -T 10 -t rsa "$VPS_HOST" \
            > "$tmpfile" 2>/dev/null

          if [ ! -s "$tmpfile" ]; then
            echo "Cannot retrieve VPS RSA host key" >&2
            exit 1
          fi

          host_fp=$(
            ssh-keygen -lf "$tmpfile" -E sha256 |
            awk '{print $2}'
          )

          if [ "$host_fp" != "$VPS_HOST_FINGERPRINT" ]; then
            echo "VPS host fingerprint mismatch" >&2
            exit 1
          fi

          cat "$tmpfile" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Check VPS deployment directory
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail

          ssh -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            "test -d /opt/projectmd5 &&
             test -w /opt/projectmd5 &&
             test -s /opt/projectmd5/.env &&
             test -s /opt/projectmd5/scripts/init-databases.sql"

      - name: Upload production Compose
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail

          scp -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            docker-compose.prod.yml \
            "$VPS_USER@$VPS_HOST:/opt/projectmd5/docker-compose.prod.yml"

      - name: Upload deployment image tag
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          if ! printf '%s' "$IMAGE_TAG" |
            grep -Eq '^[a-fA-F0-9]{40}$'; then
            echo "Invalid commit SHA" >&2
            exit 1
          fi

          printf '%s\n' "$IMAGE_TAG" | ssh \
            -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            "cat > /opt/projectmd5/.deploy-image-tag"

      - name: Deploy ProjectMD5
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail

          ssh -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 \
            "$VPS_USER@$VPS_HOST" "bash -s" <<'REMOTE'
          set -euo pipefail

          cd /opt/projectmd5

          if [ ! -s .env ]; then
            echo "ERROR: Missing production .env" >&2
            exit 1
          fi

          if [ ! -s scripts/init-databases.sql ]; then
            echo "ERROR: Missing database initialization script" >&2
            exit 1
          fi

          if [ ! -s .deploy-image-tag ]; then
            echo "ERROR: Missing deployment image tag" >&2
            exit 1
          fi

          IMAGE_TAG=$(cat .deploy-image-tag)

          if ! printf '%s' "$IMAGE_TAG" |
            grep -Eq '^[a-fA-F0-9]{40}$'; then
            echo "ERROR: Invalid image tag" >&2
            exit 1
          fi

          export IMAGE_TAG

          COMPOSE=(
            docker compose
            -p projectmd5
            --env-file .env
            -f docker-compose.prod.yml
          )

          echo "Validating Docker Compose..."
          "${COMPOSE[@]}" config --quiet

          echo "Pulling Docker images..."
          "${COMPOSE[@]}" pull

          echo "Starting ProjectMD5..."
          "${COMPOSE[@]}" up -d --no-build

          echo "Checking containers..."
          "${COMPOSE[@]}" ps

          GATEWAY_PORT=$(
            sed -n 's/^GATEWAY_PORT=//p' .env | tail -n 1
          )
          GATEWAY_PORT=${GATEWAY_PORT:-8080}

          echo "Waiting for API Gateway..."

          for i in $(seq 1 24); do
            if curl -fsS \
              "http://127.0.0.1:${GATEWAY_PORT}/actuator/health" \
              >/dev/null; then
              echo "Gateway health check OK"
              exit 0
            fi
            sleep 10
          done

          echo "Gateway health check FAILED" >&2
          "${COMPOSE[@]}" ps
          exit 1
          REMOTE
